<title>छठ पूजा 2026 — गीत सुनू</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a1f2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --maroon:#7a1f2b;
    --maroon-deep:#4d1018;
    --marigold:#f2a33b;
    --gold:#d9a441;
    --cream:#fdf3e2;
    --dusk:#241333;
    --ink:#2b1210;
    --card:#fffaf1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'Hind',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:24px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto;position:relative;}

  /* ---- Hero (home banner) ---- */
  .hero{
    position:relative;
    overflow:hidden;
  }
  .hero img{
    width:100%;display:block;
    aspect-ratio:16/9;
    object-fit:cover;
  }
  .hero::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:55%;
    background:linear-gradient(180deg, rgba(36,19,51,0) 0%, rgba(36,19,51,.55) 100%);
    pointer-events:none;
  }

  /* ---- Day tabs ---- */
  .tabs{
    display:flex;gap:8px;
    padding:14px 16px 0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    background:var(--card);
    border:1px solid rgba(122,31,43,.12);
    border-radius:14px;
    padding:10px 14px 9px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(122,31,43,.10);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    min-width:118px;
  }
  .tab:active{transform:scale(.97);}
  .tab .num{
    display:block;font-family:'Baloo 2',sans-serif;font-weight:700;
    font-size:11px;color:var(--marigold);letter-spacing:.08em;
  }
  .tab .name{
    display:block;font-weight:600;font-size:14.5px;color:var(--maroon-deep);
    margin-top:2px;
  }
  .tab.active{
    background:linear-gradient(135deg,var(--maroon) 0%, var(--maroon-deep) 100%);
    box-shadow:0 10px 22px rgba(122,31,43,.35);
  }
  .tab.active .num{color:#f6c68a;}
  .tab.active .name{color:#fff8ec;}

  /* ---- Day banner (per-day photo, text baked into image) ---- */
  .day-banner{
    margin:16px 16px 0;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(122,31,43,.22);
    position:relative;
  }
  .day-banner img{
    width:100%;display:block;
    aspect-ratio:3/2;
    object-fit:cover;
  }

  /* ---- Playlist ---- */
  .list-head{
    padding:20px 22px 2px;
    font-size:12px;color:var(--marigold);font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
  }
  .list{padding:8px 16px 10px;display:flex;flex-direction:column;gap:10px;}
  .song{
    display:flex;align-items:center;gap:12px;
    background:var(--card);
    border-radius:16px;
    padding:10px 12px;
    box-shadow:0 4px 14px rgba(122,31,43,.08);
    cursor:pointer;
    border:1px solid rgba(122,31,43,.06);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .song:active{transform:scale(.985);}
  .song.playing{
    background:linear-gradient(135deg, #fff3de 0%, #fde3c4 100%);
    box-shadow:0 8px 20px rgba(217,164,65,.3);
    border-color:var(--marigold);
  }
  .track-no{
    font-family:'Baloo 2',sans-serif;font-weight:700;
    font-size:13px;color:#c79a6b;width:20px;text-align:center;flex:0 0 auto;
  }
  .art{
    width:44px;height:44px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--marigold),var(--maroon));
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  .meta{flex:1;min-width:0;}
  .meta .t{font-size:14.5px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta .s{font-size:12.5px;color:#a17a63;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dur{font-size:12px;color:#b9906f;flex:0 0 auto;font-variant-numeric:tabular-nums;}
  .playbtn{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:var(--maroon);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(122,31,43,.35);
  }
  .playbtn svg{width:14px;height:14px;fill:#fff8ec;}
  .song.playing .playbtn{background:var(--marigold);box-shadow:0 3px 10px rgba(217,164,65,.5);}

  .hint{
    padding:20px 26px 4px;text-align:center;
    font-size:12px;color:#b9906f;line-height:1.6;
  }

  /* ---- Jukebox banner ---- */
  .jukebox-card{
    margin:14px 16px 0;
    background:linear-gradient(135deg,var(--maroon) 0%, var(--maroon-deep) 100%);
    border-radius:16px;
    padding:12px 14px;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 8px 20px rgba(122,31,43,.25);
  }
  .jukebox-card .jb-art{
    width:42px;height:42px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--marigold),#fff3de);
    display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .jukebox-card .jb-meta{flex:1;min-width:0;}
  .jukebox-card .jb-meta .jb-t{color:#fff8ec;font-size:13.5px;font-weight:600;}
  .jukebox-card .jb-meta .jb-s{color:#e6b98c;font-size:11.5px;margin-top:1px;}
  .jb-play{
    width:36px;height:36px;border-radius:50%;flex:0 0 auto;border:none;
    background:var(--marigold);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .jb-play svg{width:15px;height:15px;fill:var(--maroon-deep);}
  #yt-frame-wrap{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;}

  .searchbtn{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:none;border:1.5px solid var(--marigold);
    display:flex;align-items:center;justify-content:center;
  }
  .searchbtn svg{width:14px;height:14px;fill:var(--maroon);}

  .install-btn{
    margin:12px 16px 0;width:calc(100% - 32px);
    background:var(--card);
    border:1.5px dashed var(--marigold);
    border-radius:14px;
    padding:11px 14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Hind',sans-serif;font-weight:600;font-size:13.5px;
    color:var(--maroon-deep);
    cursor:pointer;
  }
</style>
</head>

let dayIdx = 0, jbPlaying = false;

const SEARCH_ICON = '<path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>';

const tabsEl = document.getElementById('tabs');
const listEl = document.getElementById('list');
const dayBannerImg = document.getElementById('dayBannerImg');
const ytFrame = document.getElementById('ytFrame');
const jbPlayBtn = document.getElementById('jbPlayBtn');
const jbPlayIcon = document.getElementById('jbPlayIcon');

function renderTabs(){
  tabsEl.innerHTML = days.map((d,i)=>`
    <button class="tab ${i===dayIdx?'active':''}" data-i="${i}">
      <span class="num">${d.num}</span>
      <span class="name">${d.name}</span>
    </button>`).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ dayIdx = +btn.dataset.i; render(); });
  });
}

function renderBanner(){
  const d = days[dayIdx];
  dayBannerImg.src = banners[d.key];
  dayBannerImg.alt = d.name;
}

function renderList(){
  const d = days[dayIdx];
  listEl.innerHTML = d.songs.map((song,i)=>`
    <div class="song" data-i="${i}">
      <span class="track-no">${String(i+1).padStart(2,'0')}</span>
      <div class="art">🎵</div>
      <div class="meta">
        <div class="t">${song.t}</div>
        <div class="s">${song.s}</div>
      </div>
      <span class="dur">${song.d}</span>
      <button class="searchbtn" aria-label="YouTube पर खोजें">
        <svg viewBox="0 0 24 24">${SEARCH_ICON}</svg>
      </button>
    </div>`).join('');
  listEl.querySelectorAll('.song').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.i;
      const song = days[dayIdx].songs[i];
      const q = encodeURIComponent(song.t + ' ' + song.s + ' chhath geet');
      window.open('https://www.youtube.com/results?search_query=' + q, '_blank');
    });
  });
}

function ytCommand(func){
  ytFrame.contentWindow.postMessage(JSON.stringify({event:'command', func, args:[]}), '*');
}

jbPlayBtn.addEventListener('click', ()=>{
  jbPlaying = !jbPlaying;
  ytCommand(jbPlaying ? 'playVideo' : 'pauseVideo');
  jbPlayIcon.innerHTML = jbPlaying
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
});

function render(){ renderTabs(); renderBanner(); renderList(); }
render();

// ---- PWA: service worker + install prompt ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (installBtn) installBtn.style.display = 'flex';
});

if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.style.display = 'none';
  });
}

window.addEventListener('appinstalled', () => {
  if (installBtn) installBtn.style.display = 'none';
});
